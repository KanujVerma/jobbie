name: Phase 3 tests
on:
  push:
    branches: ['feat/p3-*']
  pull_request:
    branches: [main, 'feat/p3-*']
permissions:
  contents: read
concurrency:
  group: phase3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase3:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'feat/p3-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify Phase 2 isolation
        run: |
          git fetch origin main
          base=$(git merge-base HEAD origin/main)
          git diff --exit-code "$base" HEAD -- main.py src companies.yaml public-feeds.yaml requirements.txt requirements-catalogue.txt .github/workflows/job-alerts.yml state
      - name: Verify documentation continuity
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_handoff_docs.py --base "$BASE_SHA" --head HEAD
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate configuration and run tests
        run: |
          python main.py validate-config
          python -m pytest -q
