name: Job Alerts
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Backstop. Without this the job inherits GitHub's 6h default: on 2026-08-18 an
    # apt mirror stall inside `playwright install --with-deps` ran 360 minutes in a
    # single run before being killed. Corrected 2026-08-20: this repo is PUBLIC, so
    # Actions minutes are free and unlimited and none of that was billed. The real
    # cost was a dead run holding the concurrency group, which is reason enough to
    # keep the cap — but do not cite money as the reason, because there is none.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        timeout-minutes: 5
        run: pip install -r requirements.txt
      - name: Install optional catalogue transport
        id: catalogue_deps
        continue-on-error: true
        timeout-minutes: 2
        run: pip install -r requirements-catalogue.txt
      - name: Plan catalogue shadow restore
        id: catalogue_plan
        continue-on-error: true
        timeout-minutes: 1
        run: python main.py catalogue-shadow plan
      - name: Restore exact encrypted catalogue
        id: catalogue_cache
        if: steps.catalogue_deps.outcome == 'success' && steps.catalogue_plan.outputs.restore == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@v4
        with:
          path: state/catalogue-shadow/sealed.bin
          key: ${{ steps.catalogue_plan.outputs.cache_key }}
      - name: Open catalogue shadow safely
        id: catalogue_open
        continue-on-error: true
        timeout-minutes: 1
        run: |
          args=()
          if [ "$BOOTSTRAP" = true ]; then args+=(--allow-bootstrap); fi
          python main.py catalogue-shadow restore --cache-hit "$CACHE_HIT" "${args[@]}"
        env:
          JOBBIE_CATALOGUE_KEY: ${{ secrets.CATALOGUE_SHADOW_KEY }}
          BOOTSTRAP: ${{ steps.catalogue_plan.outputs.bootstrap || 'false' }}
          CACHE_HIT: ${{ steps.catalogue_cache.outputs.cache-hit || 'false' }}
      - name: Check whether any enabled company needs a browser
        # Only phenom_people and eightfold_playwright touch the browser, and both
        # belong to companies that are currently disabled — so the three Chromium
        # steps below did nothing on all 96 runs a day. Skipping them also removes
        # the failure mode that broke CI on 2026-08-18, rather than hardening it.
        # Driven by the config, not hardcoded: enabling Snowflake turns them back on.
        id: browser
        timeout-minutes: 2
        run: |
          # Fail safe. If the probe itself breaks, install the browser anyway —
          # an unnecessary install costs 20s, a missing one silently guts a scrape.
          needed="$(python main.py needs-browser 2>/dev/null || echo true)"
          case "$needed" in
            true|false) ;;
            *) needed=true ;;
          esac
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "browser needed: $needed"
      - name: Cache Playwright browsers
        if: steps.browser.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install Chromium
        if: steps.browser.outputs.needed == 'true'
        # Browser binary only. `--with-deps` was removed on 2026-08-19: it shells
        # out to `sudo apt-get`, and when the 180s timeout fired mid-download the
        # killed python left an orphaned apt-get holding /var/lib/dpkg/lock-frontend,
        # so retries 2 and 3 failed instantly on the lock and could never have
        # succeeded. apt also has no cache here, so it ran on every 15-minute job.
        # The runner image ships Google Chrome, so the shared libraries headless
        # Chromium needs are already present; the only packages apt ever added were
        # CJK/Thai/Cyrillic glyph fonts, and this bot reads DOM text rather than
        # rendering it. The smoke check below is what proves that assumption per-run.
        timeout-minutes: 7
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=30 120 python -m playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright install attempt $attempt failed; retrying"
            sleep 10
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1
      - name: Verify Chromium launches
        if: steps.browser.outputs.needed == 'true'
        # Turns "the runner image already has the deps" from an assumption into a
        # checked fact. If a future image drops a shared library this fails here
        # with the loader error, instead of surfacing as a confusing scrape failure.
        timeout-minutes: 2
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              page = browser.new_page()
              page.set_content("<h1>ok</h1>")
              assert page.inner_text("h1") == "ok"
              browser.close()
          print("chromium launched and rendered DOM text")
          PY
      - name: Run job alerts
        id: scan
        # Raised 8 -> 14 on 2026-08-20. Adding Microsoft took a measured full
        # sweep from 276s to 444s: that adapter pages a rate-limited API and
        # must space requests 3-5s apart, costing ~90s on its own. 444s against
        # a 480s cap left 36s of margin, and blowing the cap kills the run
        # before state is written, so every alert in it is lost and re-sent next
        # time. The job-level 20m cap below is still the real backstop.
        timeout-minutes: 14
        run: python main.py run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOBBIE_CATALOGUE_MODE: ${{ steps.catalogue_open.outputs.mode || 'off' }}
          JOBBIE_CATALOGUE_DB: state/catalogue-shadow/jobs.sqlite
      - name: Publish source and delivery health snapshot
        if: always()
        run: python main.py health --format markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Commit state
        # A partial scan can deliver postings, save their ACKs, then exit 1.
        # Preserve that ledger while keeping the scan/workflow failure visible.
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        timeout-minutes: 3
        run: |
          git config user.name  "job-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_jobs.json
          # Restore may update this tracked health file. Include it so rebase
          # cannot reject the ACK push because of an unstaged metadata change.
          if [ -f state/catalogue_shadow_health.json ]; then git add state/catalogue_shadow_health.json; fi
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git pull --rebase origin main && git push)

      # ACK state is committed above before optional cache transport. A cache
      # failure/timeout must never discard successful legacy delivery receipts.
      - name: Seal bounded catalogue checkpoint
        id: catalogue_seal
        if: ${{ !cancelled() && steps.catalogue_open.outputs.mode == 'shadow' && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 2
        run: |
          gh api repos/KanujVerma/jobbie/actions/cache/usage > state/catalogue-shadow/cache-usage.json
          python main.py catalogue-shadow seal --allow-incomplete --cache-usage state/catalogue-shadow/cache-usage.json
        env:
          GH_TOKEN: ${{ github.token }}
          JOBBIE_CATALOGUE_KEY: ${{ secrets.CATALOGUE_SHADOW_KEY }}
      - name: Save encrypted catalogue checkpoint
        if: ${{ !cancelled() && steps.catalogue_seal.outputs.ready == 'true' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@v4
        with:
          path: state/catalogue-shadow/sealed.bin
          key: ${{ steps.catalogue_seal.outputs.cache_key }}
      - name: Prepare fresh catalogue cache probe
        id: catalogue_probe_prepare
        if: ${{ !cancelled() && steps.catalogue_seal.outputs.ready == 'true' }}
        continue-on-error: true
        run: python main.py catalogue-shadow probe-prepare
      - name: Restore newly saved catalogue for verification
        id: catalogue_probe
        if: ${{ !cancelled() && steps.catalogue_probe_prepare.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@v4
        with:
          path: state/catalogue-shadow/sealed.bin
          key: ${{ steps.catalogue_seal.outputs.cache_key }}
      - name: Publish verified catalogue checkpoint
        id: catalogue_publish
        if: ${{ !cancelled() && steps.catalogue_probe_prepare.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 1
        run: python main.py catalogue-shadow publish --cache-hit "$CACHE_HIT"
        env:
          JOBBIE_CATALOGUE_KEY: ${{ secrets.CATALOGUE_SHADOW_KEY }}
          CACHE_HIT: ${{ steps.catalogue_probe.outputs.cache-hit || 'false' }}
      - name: Publish catalogue shadow health
        if: always()
        run: |
          if [ -f state/catalogue_shadow_health.json ]; then
            echo 'Catalogue shadow health (legacy delivery authority):' >> "$GITHUB_STEP_SUMMARY"
            cat state/catalogue_shadow_health.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit catalogue custody metadata
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          for file in state/catalogue_shadow_checkpoint.json state/catalogue_shadow_health.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          git diff --cached --quiet || (git commit -m "state: catalogue custody $(date -u +%FT%TZ)" && git pull --rebase origin main && git push)
